  <rect x="82" y="68" width="72" height="72" rx="18" fill="#111827" stroke="#334155"/>
  <path d="M105 90h27l-15 18h18l-30 28 8-20h-14z" fill="url(#accent)"/>
</g>
<text x="190" y="112" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">IRANNA S J</text>
<text x="193" y="153" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="21">Software Developer  ·  Android  ·  AI/ML  ·  Enterprise Systems</text>
<rect x="193" y="184" width="390" height="2" rx="1" fill="url(#accent)"/>
<text x="193" y="222" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="16">Building practical software with clean architecture</text>
<text x="193" y="248" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="16">and intelligent systems.</text>
