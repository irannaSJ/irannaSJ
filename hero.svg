<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0b1020"/>
    <stop offset="55%" stop-color="#111827"/>
    <stop offset="100%" stop-color="#090d18"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7c3aed"/>
    <stop offset="50%" stop-color="#22d3ee"/>
    <stop offset="100%" stop-color="#60a5fa"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0%" stop-color="#22d3ee" stop-opacity=".28"/>
    <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  <style>
    .pulse { animation: pulse 4s ease-in-out infinite; }
    .float { animation: float 6s ease-in-out infinite; }
    .dash { animation: dash 8s linear infinite; }
    @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:.8} }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    @keyframes dash { to { stroke-dashoffset:-240; } }
  </style>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<circle class="pulse" cx="1040" cy="80" r="180" fill="url(#glow)" filter="url(#blur)"/>
<circle class="pulse" cx="180" cy="330" r="160" fill="url(#glow)" filter="url(#blur)"/>
<path d="M0 275 C180 210 260 330 430 260 S710 185 850 250 S1060 315 1200 230" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity=".35" stroke-dasharray="8 16" class="dash"/>
