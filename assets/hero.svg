<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="background" x1="0" y1="0" x2="1200" y2="280">
    <stop stop-color="#08090B"/>
    <stop offset="1" stop-color="#111318"/>
</linearGradient>

<radialGradient id="glow">
    <stop stop-color="#8B5CF6" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
</radialGradient>

<linearGradient id="line" x1="350" y1="0" x2="850" y2="0">
    <stop stop-color="#60A5FA" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#A78BFA"/>
    <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
</linearGradient>

</defs>

<!-- Background -->

<rect width="1200" height="280" rx="20" fill="url(#background)"/>

<!-- Very subtle grid -->

<g opacity="0.035" stroke="white">

<path d="M0 70H1200"/>
<path d="M0 140H1200"/>
<path d="M0 210H1200"/>

<path d="M100 0V280"/>
<path d="M200 0V280"/>
<path d="M300 0V280"/>
<path d="M400 0V280"/>
<path d="M500 0V280"/>
<path d="M600 0V280"/>
<path d="M700 0V280"/>
<path d="M800 0V280"/>
<path d="M900 0V280"/>
<path d="M1000 0V280"/>
<path d="M1100 0V280"/>

</g>

<!-- Soft moving glow -->

<ellipse cx="600" cy="140" rx="300" ry="150" fill="url(#glow)">

<animate
attributeName="cx"
values="450;750;450"
dur="12s"
repeatCount="indefinite"/>

<animate
attributeName="opacity"
values="0.5;1;0.5"
dur="8s"
repeatCount="indefinite"/>

</ellipse>

<!-- Name -->

<text
x="600"
y="125"
text-anchor="middle"
font-family="Arial, Helvetica, sans-serif"
font-size="48"
font-weight="600"
letter-spacing="1"
fill="#F5F5F5">

IRANNA S J

</text>

<!-- Identity -->

<text
x="600"
y="160"
text-anchor="middle"
font-family="Arial, Helvetica, sans-serif"
font-size="17"
letter-spacing="5"
fill="#A1A1AA">

SOFTWARE · ANDROID · AI

</text>

<!-- Animated accent -->

<rect
x="470"
y="188"
width="260"
height="1"
fill="url(#line)">

<animate
attributeName="width"
values="180;260;180"
dur="6s"
repeatCount="indefinite"/>

<animate
attributeName="x"
values="510;470;510"
dur="6s"
repeatCount="indefinite"/>

</rect>

</svg>
